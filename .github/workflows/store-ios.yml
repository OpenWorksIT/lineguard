name: iOS store build

# Archives the iPhone app, signs it and uploads it to App Store Connect (TestFlight),
# from where it can be submitted for App Store review.
# Run it from the Actions tab ("Run workflow"). Needs these repository secrets:
#   APPLE_TEAM_ID        the 10-character Team ID from developer.apple.com > Membership
#   ASC_KEY_ID           an App Store Connect API key's Key ID (Users and Access > Integrations, role Admin)
#   ASC_ISSUER_ID        the Issuer ID shown on that page
#   ASC_KEY_P8_B64       the downloaded AuthKey_XXXX.p8 file, base64 encoded
# Xcode uses the API key to create the signing certificate and profile itself (automatic signing),
# so no certificates need to be exported by hand.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]      # pushing a release tag (e.g. v0.3.0) builds and uploads both store apps

permissions:
  contents: read

jobs:
  testflight:
    environment: store   # secrets live in this environment, which needs your approval to run
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts   # no package needs install scripts to build the app
      - run: npm run build
      - run: npx cap sync ios
      - name: Check the secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          for v in TEAM KEY_ID ISSUER P8; do
            if [ -z "${!v}" ]; then echo "::error title=Missing secret::See the list at the top of store-ios.yml"; exit 1; fi
          done
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$P8" | base64 -d > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
      - name: Archive
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          VERSION=$(node -p "require('../../package.json').version")
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LineGuard.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            archive | tail -60
      - name: Sign and upload to App Store Connect
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          sed "s/TEAM_ID_HERE/$TEAM/" ../ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LineGuard.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -40
          echo "Uploaded build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT} to App Store Connect. It appears in TestFlight after Apple's processing (usually 10-30 minutes)." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
