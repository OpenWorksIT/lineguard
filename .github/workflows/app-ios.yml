name: iOS app

# macOS runners are free on a public repository but cost about ten times Linux ones on a private one,
# so on pushes this compile check only runs while the repository is public.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts   # no package needs install scripts to build the app
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the simulator (checks that the app compiles; no Apple account needed)
        working-directory: app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
      # Installing on iPhones needs an Apple Developer account: see app/README.md (TestFlight).
