<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden}
body{background:radial-gradient(ellipse at 25% 45%,#2a3d6b 0,#15203a 55%,#0d1528 100%);font-family:Inter,system-ui,sans-serif;color:#f2f5fb;display:flex;align-items:center;justify-content:center}
.wrap{display:flex;align-items:center;gap:6vh;height:78vh}
.text{display:flex;flex-direction:column;gap:2.6vh;max-width:46vh*1}
.brand{display:flex;align-items:center;gap:2.4vh}
.icon{width:15vh;height:15vh;border-radius:3.4vh;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1.5vh 4vh rgba(0,0,0,.35)}
.icon img{width:14vh}
h1{font-size:11vh;margin:0;letter-spacing:-.25vh;font-weight:800}
p{font-size:4.6vh;line-height:1.25;margin:0;color:#c9d3ea;max-width:80vh}
.chips{display:flex;gap:1.4vh;flex-wrap:wrap}
.chips span{font-size:2.8vh;padding:1vh 2vh;border-radius:99vh;background:#2c3e66;color:#e8ecfb;font-weight:700}
.chips span.a{background:#ffb703;color:#15203a}
.phones{display:flex;align-items:center;gap:3vh;height:100%}
.phone{height:100%;aspect-ratio:1320/2868;border-radius:5vh;background:#0b0f1a;padding:1.1vh;box-shadow:0 3vh 7vh rgba(0,0,0,.5);box-sizing:border-box}
.phone img{width:100%;height:100%;border-radius:4.1vh;display:block;object-fit:cover}
.phone.small{height:88%}
</style></head><body><div class="wrap">
<div class="text"><div class="brand"><div class="icon"><img src="fg.png"></div><h1>LineGuard</h1></div>
<p>Drive straight to every hotspot your drone found on the powerlines.</p>
<div class="chips"><span class="a">33 kV and up</span><span>Works offline</span><span>Voice guidance</span><span>Open source</span></div></div>
<div class="phones"><div class="phone small"><img src="list.png"></div><div class="phone"><img src="drive.png"></div><div class="phone small"><img src="hot.png"></div></div>
</div><script>
const w=document.querySelector('.wrap'); const r=w.getBoundingClientRect();
const k=Math.min(1,(innerWidth*0.86)/r.width,(innerHeight*0.86)/r.height); w.style.transform='scale('+k+')';
</script></body></html>
